<div class="kpis">
  {% for k in lista %}
  <div class="kpi">
    <div class="t">{% if k.color %}<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:{{ k.color }};margin-right:6px"></span>{% endif %}{{ k.titulo }}</div>
    <div class="v">{{ k.valor }}</div>
    <div class="d {{ k.tono }}">{% if k.delta %}{{ k.flecha }} {{ k.delta }} vs. semana anterior{% else %}&nbsp;{% endif %}</div>
  </div>
  {% endfor %}
</div>
